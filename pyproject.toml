[project]
name = "jobradar"
version = "0.1.0"
description = "Near-real-time job-posting alerts, matched against your CV by Claude, delivered to Telegram"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "langdetect>=1.0.9",
    "anthropic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors and unused code, I: import order, UP: modern syntax,
# B: likely bugs. Broad `except Exception` is deliberate in the fail-open
# paths (scoring, notifications), so the blind-except rule is not enabled.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are almost all prompt text and log messages
