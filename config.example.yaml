# Copy to config.yaml and edit. config.yaml is gitignored: your searches can
# reveal which roles you are targeting.

# Every keyword of every board is searched in every location that board
# covers. A location gives its query per board, in that board's own format:
# free text on LinkedIn, a URL slug on Wellfound. Leave a board's key out to
# skip that board for that location.
locations:
  - name: "Porto"
    linkedin: "Porto, Portugal"
    wellfound: "porto"

sources:
  linkedin:
    keywords:
      - "AI Engineer"
      - "LLM Engineer"
    # How far back each search looks. It must comfortably exceed
    # poll_interval_minutes, or a posting published between two polls is
    # never seen; anything already seen is ignored, so a wide window is safe.
    time_posted_seconds: 3600
    max_pages: 3                  # 10 results per page

  wellfound:
    # Role slugs from Wellfound's own vocabulary, not free text: the <role>
    # part of https://wellfound.com/role/l/<role>/<location>.
    keywords:
      - "artificial-intelligence-engineer"
    # Wellfound keeps postings up for weeks, so a narrow window finds nothing.
    time_posted_seconds: 259200   # 3 days

# Everything below is optional; these are the defaults.
pipeline:
  poll_interval_minutes: 10
  poll_jitter_seconds: 60                 # random offset so polls are not clockwork-regular
  db_path: "state.db"
  log_path: "jobradar.log"
  profile_path: "profile.yaml"            # without this file nothing is filtered

  # Health warnings sent to Telegram.
  consecutive_error_alert_threshold: 3    # failed fetches in a row for one search
  consecutive_empty_alert_threshold: 24   # empty results in a row (~4h): the parser may be broken

  # What gets alerted. A job must look relevant by title, then cover enough
  # of the posting's must-have requirements (computed from the list the
  # model returns, see scoring.py), be junior-appropriate, and fit
  # profile.yaml's location_preferences.
  deep_score_threshold: 4                 # title score (1-10) needed to read the full description
  min_coverage_pct: 60                    # requirement coverage needed to alert
  digest_min_coverage_pct: 50             # near misses from here up are summarised once a day
  years_stretch: 1                        # years above max_years_experience still alerted, with a warning
  digest_hour: 9                          # local hour of that daily summary

  # Claude model for each pass. Set deep_model to "claude-sonnet-5-5" for a
  # stronger (and costlier) judgment on the full-description pass only.
  title_model: "claude-haiku-5-5"
  deep_model: "claude-haiku-5-5"
